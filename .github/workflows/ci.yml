name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
          - runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - uses: getchore/setup-chore@v1
      - uses: astral-sh/setup-uv@v5
      - name: Fetch ggml libraries
        run: chore headers && chore fetch-libs
      - name: Lint
        run: chore lint
      - name: Test
        run: chore test
