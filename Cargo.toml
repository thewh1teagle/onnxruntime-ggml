[workspace]
members = ["crates/ggml-sys", "crates/ort-ep-sys", "crates/onnxruntime-ggml"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/thewh1teagle/onnxruntime-ggml"

[workspace.dependencies]
bindgen = "0.72"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
half = "2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
