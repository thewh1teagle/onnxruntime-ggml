[project]
name = "onnxruntime-ggml"
version = "0.2.0"
description = "An onnxruntime execution provider that runs ONNX models on ggml (Metal, Vulkan, CPU)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "thewh1teagle" }]
dependencies = ["onnxruntime>=1.29,<1.31"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/thewh1teagle/onnxruntime-ggml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onnxruntime_ggml"]
# The native library is copied in by `chore wheels` before each platform build.
artifacts = ["onnxruntime_ggml/lib/*"]

[tool.hatch.build.targets.sdist]
exclude = ["onnxruntime_ggml/lib/*"]
